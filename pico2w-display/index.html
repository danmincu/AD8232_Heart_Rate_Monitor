<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD8232 ECG Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#bar{height:40px;background:#1a1a2e;color:#ccc;display:flex;align-items:center;
  padding:0 16px;font-size:14px;gap:20px;border-bottom:2px solid #0f3460;user-select:none}
.bpm{color:#ff4444;font-weight:bold;font-size:16px;min-width:140px;white-space:nowrap}
.val{color:#888;font-family:monospace;min-width:110px}
.st{margin-left:auto;font-size:12px}
.st.ok{color:#4caf50}.st.err{color:#f44336}
#lbtn{padding:3px 14px;background:transparent;color:#e94560;border:1px solid #e94560;
  border-radius:3px;cursor:pointer;font-size:11px;font-weight:bold;display:none}
#lbtn:hover{background:#e94560;color:#fff}
canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<div id="bar">
  <span class="bpm" id="bpm">&#9829; -- BPM</span>
  <span class="val" id="val">data: ---</span>
  <button id="lbtn" onclick="window._goLive()">&#9654; LIVE</button>
  <span class="st err" id="st">&#9679; Connecting</span>
</div>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var gridCv = document.createElement("canvas");
var gridCtx = gridCv.getContext("2d");

var samples = [];       // [[ts, value, leadsOff(0|1), bpm|null], ...]
var viewOffset = 0;     // 0 = live
var isLive = true;
var needsRedraw = true;
var signalBaseline = -1;
var signalRange = -1;          // adaptive vertical range (auto-scaled)
var lastBPMs = [];
var COMPRESS = 1;              // samples per pixel

/* ---- multi-row layout constants ---- */
var NUM_ROWS = 4;
var MINIMAP_H = 50;
var MINIMAP_GAP = 4;
var ROW_SEP = 2;

/* computed in resize() */
var traceH = 0;
var rowH = 0;
var samplesPerRow = 0;
var totalVisibleSamples = 0;

/* ---- minimap interaction ---- */
var minimapDragging = false;

/* ---- resize ---- */
function resize(){
  var h = window.innerHeight - 40;
  canvas.width = window.innerWidth;
  canvas.height = Math.max(h, 200);

  traceH = canvas.height - MINIMAP_H - MINIMAP_GAP;
  rowH = Math.floor((traceH - ROW_SEP * (NUM_ROWS - 1)) / NUM_ROWS);
  samplesPerRow = canvas.width * COMPRESS;
  totalVisibleSamples = NUM_ROWS * samplesPerRow;

  gridCv.width = canvas.width;
  gridCv.height = canvas.height;
  drawGrid();
  needsRedraw = true;
}
window.addEventListener("resize", resize);
resize();

/* ---- grid (offscreen, redrawn on resize) ---- */
function drawGrid(){
  var w = gridCv.width, h = gridCv.height, g = gridCtx;

  /* white background for trace area only */
  g.fillStyle = "#ffffff";
  g.fillRect(0, 0, w, traceH);

  /* dark background below trace (minimap region) */
  g.fillStyle = "#111111";
  g.fillRect(0, traceH, w, h - traceH);

  /* vertical lines spanning trace area */
  var x;
  for(x = 0; x < w; x += 40){
    var vmaj = (x % 200 === 0);
    g.strokeStyle = vmaj ? "rgba(220,80,80,0.40)" : "rgba(255,150,150,0.35)";
    g.lineWidth   = vmaj ? 1.0 : 0.5;
    g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, traceH); g.stroke();
  }

  /* horizontal lines centred within EACH row */
  for(var r = 0; r < NUM_ROWS; r++){
    var rowTop = r * (rowH + ROW_SEP);
    var midY = Math.round(rowTop + rowH / 2);

    for(var i = 0; i * 40 <= rowH; i++){
      var hmaj = (i % 5 === 0);
      var offsets = (i === 0) ? [0] : [-i * 40, i * 40];
      for(var oi = 0; oi < offsets.length; oi++){
        var y = midY + offsets[oi];
        if(y < rowTop || y > rowTop + rowH) continue;
        g.strokeStyle = hmaj ? "rgba(220,80,80,0.40)" : "rgba(255,150,150,0.35)";
        g.lineWidth   = hmaj ? 1.0 : 0.5;
        g.beginPath(); g.moveTo(0, Math.round(y)+0.5); g.lineTo(w, Math.round(y)+0.5); g.stroke();
      }
    }
  }

  /* row separator lines */
  g.strokeStyle = "rgba(180,60,60,0.50)";
  g.lineWidth = ROW_SEP;
  for(var rs = 1; rs < NUM_ROWS; rs++){
    var sy = rs * (rowH + ROW_SEP) - ROW_SEP / 2;
    g.beginPath(); g.moveTo(0, Math.round(sy)+0.5); g.lineTo(w, Math.round(sy)+0.5); g.stroke();
  }
}

/* ---- helpers ---- */
function v2yRow(v, rowTop, rH){
  var range = (signalRange > 0) ? signalRange : 1023;
  var mid = rowTop + rH / 2;
  return mid + (v - signalBaseline) * (rH / range);
}

function v2yMinimap(v, mmTop, mmH){
  var range = (signalRange > 0) ? signalRange : 1023;
  var mid = mmTop + mmH / 2;
  return mid + (v - signalBaseline) * (mmH / range);
}

/* clamp y to row bounds */
function clampRow(y, rowTop, rH){
  if(y < rowTop) return rowTop;
  if(y > rowTop + rH) return rowTop + rH;
  return y;
}

/* ---- render ---- */
function render(){
  if(!needsRedraw){ requestAnimationFrame(render); return; }
  needsRedraw = false;

  var w = canvas.width, h = canvas.height, n = samples.length;
  ctx.drawImage(gridCv, 0, 0);

  if(n < 2){ requestAnimationFrame(render); return; }

  var endIdx   = Math.max(1, n - viewOffset);
  var startIdx = Math.max(0, endIdx - totalVisibleSamples);
  var count    = endIdx - startIdx;

  /* auto-centre + auto-scale from visible data */
  var vmin = 99999, vmax = -99999;
  for(var j = startIdx; j < endIdx; j++){
    var sv = samples[j][1];
    if(sv < vmin) vmin = sv;
    if(sv > vmax) vmax = sv;
  }

  var visMid = (vmin + vmax) / 2;
  if(signalBaseline < 0) signalBaseline = visMid;
  else signalBaseline = signalBaseline * 0.90 + visMid * 0.10;

  var visRange = Math.max(vmax - vmin, 30) * 1.3;
  if(signalRange < 0){
    signalRange = visRange;
  } else {
    if(visRange > signalRange) signalRange = signalRange * 0.3 + visRange * 0.7;
    else                       signalRange = signalRange * 0.98 + visRange * 0.02;
  }

  /* ---- Row loop ---- */
  ctx.lineWidth = 1.8;
  ctx.lineJoin = "round";
  ctx.lineCap  = "round";

  for(var r = 0; r < NUM_ROWS; r++){
    var rowTop = r * (rowH + ROW_SEP);
    var rowStartIdx = startIdx + r * samplesPerRow;
    var rowEndIdx = Math.min(endIdx, rowStartIdx + samplesPerRow);

    if(rowStartIdx >= endIdx) break; /* no data for this row */

    var rowCount = rowEndIdx - rowStartIdx;
    var xOff = 0; /* left-align like medical ECG strip chart */

    /* ECG trace for this row */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, rowTop, w, rowH);
    ctx.clip();

    var curLO = samples[rowStartIdx][2];
    ctx.strokeStyle = curLO ? "#0000ff" : "#000000";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(xOff, clampRow(v2yRow(samples[rowStartIdx][1], rowTop, rowH), rowTop, rowH));

    var bpmLabels = [];

    for(var i = rowStartIdx + 1; i < rowEndIdx; i++){
      var s  = samples[i];
      var px = Math.round((i - rowStartIdx) / COMPRESS) + xOff;
      var py = clampRow(v2yRow(s[1], rowTop, rowH), rowTop, rowH);

      if(s[2] !== curLO){
        ctx.lineTo(px, py);
        ctx.stroke();
        curLO = s[2];
        ctx.strokeStyle = curLO ? "#0000ff" : "#000000";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }

      if(s[3] !== null && s[3] !== undefined){
        bpmLabels.push([px, s[3]]);
      }
    }
    ctx.stroke();
    ctx.restore();

    /* BPM beat labels at top of each row */
    ctx.font = "bold 12px sans-serif";
    for(var li = 0; li < bpmLabels.length; li++){
      var lx = bpmLabels[li][0], lb = bpmLabels[li][1];
      var ly = rowTop + 16;
      if(lb < 0){
        ctx.fillStyle = "rgba(255,100,0,0.60)";
        ctx.fillText("PVC", lx - 10, rowTop + rowH - 6);
      } else {
        ctx.fillStyle = "rgba(0,0,0,0.30)";
        ctx.fillText("\u2665 " + lb, lx - 10, ly);
      }
    }
  }

  /* Clinical annotations */
  ctx.font = "bold 13px sans-serif";
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillText("II", 10, 24);
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillText("25 mm/s  10 mm/mV", 10, traceH - 6);

  /* ---- minimap ---- */
  drawMinimap();

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ---- minimap rendering ---- */
function drawMinimap(){
  var w = canvas.width;
  var mmTop = traceH + MINIMAP_GAP;
  var mmH = MINIMAP_H;
  var n = samples.length;

  /* background */
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, mmTop, w, mmH);

  /* border */
  ctx.strokeStyle = "#0f3460";
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, mmTop + 0.5, w - 1, mmH - 1);

  if(n < 2) return;

  /* compute baseline/range for minimap from full buffer */
  var mmMin = 99999, mmMax = -99999;
  /* sample every Nth value for speed */
  var step = Math.max(1, Math.floor(n / (w * 2)));
  for(var i = 0; i < n; i += step){
    var v = samples[i][1];
    if(v < mmMin) mmMin = v;
    if(v > mmMax) mmMax = v;
  }
  var mmMid = (mmMin + mmMax) / 2;
  var mmRange = Math.max(mmMax - mmMin, 30) * 1.3;

  /* min-max compressed trace: for each pixel column, draw a vertical line from min to max */
  ctx.strokeStyle = "rgba(233,69,96,0.7)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  var samplesPerPx = n / w;
  var drawn = false;
  for(var px = 0; px < w; px++){
    var s0 = Math.floor(px * samplesPerPx);
    var s1 = Math.min(n - 1, Math.floor((px + 1) * samplesPerPx));
    var pmin = 99999, pmax = -99999;
    /* sample a few points within the range for speed */
    var pstep = Math.max(1, Math.floor((s1 - s0) / 4));
    for(var si = s0; si <= s1; si += pstep){
      var sv = samples[si][1];
      if(sv < pmin) pmin = sv;
      if(sv > pmax) pmax = sv;
    }
    /* also check endpoints */
    var sv0 = samples[s0][1], sv1 = samples[s1][1];
    if(sv0 < pmin) pmin = sv0;
    if(sv0 > pmax) pmax = sv0;
    if(sv1 < pmin) pmin = sv1;
    if(sv1 > pmax) pmax = sv1;

    var yLo = mmTop + mmH / 2 + (pmax - mmMid) * (mmH * 0.8 / mmRange);
    var yHi = mmTop + mmH / 2 + (pmin - mmMid) * (mmH * 0.8 / mmRange);
    /* clamp */
    yLo = Math.max(mmTop + 1, Math.min(mmTop + mmH - 1, yLo));
    yHi = Math.max(mmTop + 1, Math.min(mmTop + mmH - 1, yHi));
    ctx.moveTo(px + 0.5, yHi);
    ctx.lineTo(px + 0.5, yLo);
    drawn = true;
  }
  if(drawn) ctx.stroke();

  /* viewport indicator */
  var endIdx = Math.max(1, n - viewOffset);
  var startIdx = Math.max(0, endIdx - totalVisibleSamples);
  var vpX1 = Math.round(startIdx / n * w);
  var vpX2 = Math.round(endIdx / n * w);
  var vpW = Math.max(vpX2 - vpX1, 4);

  ctx.fillStyle = "rgba(233,69,96,0.25)";
  ctx.fillRect(vpX1, mmTop, vpW, mmH);
  ctx.strokeStyle = "rgba(233,69,96,0.70)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(vpX1 + 0.5, mmTop + 0.5, vpW - 1, mmH - 1);
}

/* ---- minimap click/drag interaction ---- */
function minimapHitTest(y){
  return y >= traceH + MINIMAP_GAP && y < traceH + MINIMAP_GAP + MINIMAP_H;
}

function minimapJump(clientX){
  var rect = canvas.getBoundingClientRect();
  var x = clientX - rect.left;
  var n = samples.length;
  if(n < 2) return;

  /* Map click position to center of viewport at that position */
  var frac = x / canvas.width;
  var centerSample = Math.round(frac * n);
  var halfVisible = Math.floor(totalVisibleSamples / 2);
  var newEnd = centerSample + halfVisible;
  var newOffset = n - newEnd;
  newOffset = Math.round(Math.max(0, Math.min(newOffset, Math.max(0, n - totalVisibleSamples))));

  viewOffset = newOffset;
  isLive = (viewOffset === 0);
  document.getElementById("lbtn").style.display = isLive ? "none" : "inline-block";
  needsRedraw = true;
}

canvas.addEventListener("mousedown", function(e){
  var rect = canvas.getBoundingClientRect();
  var y = e.clientY - rect.top;
  if(minimapHitTest(y)){
    minimapDragging = true;
    minimapJump(e.clientX);
    e.preventDefault();
  }
});

canvas.addEventListener("mousemove", function(e){
  if(minimapDragging){
    minimapJump(e.clientX);
    e.preventDefault();
  }
});

window.addEventListener("mouseup", function(){
  minimapDragging = false;
});

/* touch support for minimap */
canvas.addEventListener("touchstart", function(e){
  var rect = canvas.getBoundingClientRect();
  var touch = e.touches[0];
  var y = touch.clientY - rect.top;
  if(minimapHitTest(y)){
    minimapDragging = true;
    minimapJump(touch.clientX);
    e.preventDefault();
  }
}, {passive: false});

canvas.addEventListener("touchmove", function(e){
  if(minimapDragging && e.touches.length > 0){
    minimapJump(e.touches[0].clientX);
    e.preventDefault();
  }
}, {passive: false});

canvas.addEventListener("touchend", function(){
  minimapDragging = false;
});

/* ---- scroll ---- */
canvas.addEventListener("wheel", function(e){
  /* ignore wheel on minimap area */
  var rect = canvas.getBoundingClientRect();
  var y = e.clientY - rect.top;
  if(minimapHitTest(y)){ e.preventDefault(); return; }

  e.preventDefault();
  var delta = (e.deltaMode === 1) ? e.deltaY * 40 : e.deltaY;
  /* scale by NUM_ROWS for proportional scroll */
  delta *= NUM_ROWS;
  viewOffset = Math.round(Math.max(0, Math.min(
    viewOffset - delta,
    Math.max(0, samples.length - totalVisibleSamples)
  )));
  isLive = (viewOffset === 0);
  document.getElementById("lbtn").style.display = isLive ? "none" : "inline-block";
  needsRedraw = true;
}, {passive: false});

window._goLive = function(){
  viewOffset = 0; isLive = true;
  document.getElementById("lbtn").style.display = "none";
  needsRedraw = true;
};

/* double-click to go live */
canvas.addEventListener("dblclick", function(){ window._goLive(); });

/* ---- BPM status bar ---- */
function updateBPMBar(){
  if(lastBPMs.length === 0){
    document.getElementById("bpm").textContent = "\u2665 -- BPM";
    return;
  }
  var sum = 0;
  for(var i = 0; i < lastBPMs.length; i++) sum += lastBPMs[i];
  var avg = Math.round(sum / lastBPMs.length);
  var display = "\u2665 " + avg + " avg | " + lastBPMs.join(", ");
  document.getElementById("bpm").textContent = display;
}

/* ---- SSE (Server-Sent Events) ---- */
function connect(){
  var es = new EventSource("/events");

  es.onopen = function(){
    document.getElementById("st").textContent = "\u25cf Connected";
    document.getElementById("st").className = "st ok";
  };

  es.onerror = function(){
    document.getElementById("st").textContent = "\u25cf Reconnecting...";
    document.getElementById("st").className = "st err";
  };

  es.onmessage = function(e){
    var msg = JSON.parse(e.data);

    if(msg.type === "init"){
      samples = [];
      lastBPMs = [];
      if(msg.bpm && msg.bpm > 0){
        lastBPMs.push(msg.bpm);
      }
      signalBaseline = -1;
      signalRange = -1;
      updateBPMBar();
      needsRedraw = true;
      return;
    }

    if(msg.type === "d"){
      var ts = msg.ts;
      var lo = msg.lo;
      var bpm = msg.bpm;
      var beats = msg.b;
      var vals = msg.v;
      var added = vals.length;
      for(var i = 0; i < added; i++){
        var beatBpm = null;
        for(var bi = 0; bi < beats.length; bi++){
          if(beats[bi] === i){ beatBpm = bpm; break; }
        }
        samples.push([ts + i, vals[i], lo, beatBpm]);
        if(beatBpm !== null && beatBpm > 0){
          lastBPMs.push(beatBpm);
          if(lastBPMs.length > 10) lastBPMs.shift();
          updateBPMBar();
        }
      }
      if(added > 0){
        document.getElementById("val").textContent = "data: " + vals[added - 1];
      }
      /* keep view at same position when scrolled back */
      if(!isLive) viewOffset += added;
      /* trim front */
      if(samples.length > 10000){
        var excess = samples.length - 10000;
        samples.splice(0, excess);
        viewOffset = Math.max(0, viewOffset - excess);
      }
      /* clamp */
      viewOffset = Math.min(viewOffset, Math.max(0, samples.length - totalVisibleSamples));
      if(isLive) needsRedraw = true;
      return;
    }
  };
}
connect();

})();
</script>
</body>
</html>
